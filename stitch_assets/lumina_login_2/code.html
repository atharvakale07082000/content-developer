        }

<body class="bg-surface text-on-surface font-body antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation (Restricted to Shell) -->
<header class="fixed top-0 w-full z-50 bg-slate-50/80 dark:bg-slate-950/80 backdrop-blur-xl shadow-[0px_12px_32px_rgba(45,51,56,0.04)]">
<div class="max-w-screen-2xl mx-auto w-full flex justify-between items-center px-8 py-4">
<div class="text-lg font-bold tracking-tighter text-slate-900 dark:text-slate-50 font-headline">
                Lumina
            </div>
<nav class="hidden md:flex gap-8">
<a class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-200" href="#">Platform</a>
<a class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-200" href="#">Solutions</a>
<a class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors duration-200" href="#">Pricing</a>
</nav>
<div class="flex items-center gap-4">
<button class="text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-slate-900 transition-colors duration-200">Help</button>
</div>
</div>
</header>
<main class="min-h-screen flex items-center justify-center relative overflow-hidden px-6">
<!-- Background Elements for Depth -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container opacity-20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-container opacity-20 blur-[120px] rounded-full"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Glassmorphism Login Card -->
<div class="glass-card p-10 xl:rounded-xl shadow-[0px_12px_32px_rgba(45,51,56,0.04)] ring-1 ring-outline-variant/20">
<div class="flex flex-col items-center mb-10">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center mb-6 shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-2xl" data-icon="light_mode">light_mode</span>
</div>
<h1 class="text-on-background font-headline text-[1.75rem] font-bold tracking-tight mb-2">Sign in to Lumina</h1>
<p class="text-on-surface-variant text-sm font-medium">Continue your high-performance workflow</p>
</div>
<form class="space-y-6">
<div class="space-y-2">
<label class="block text-[0.75rem] font-bold uppercase tracking-widest text-on-surface-variant px-1" for="email">Email Address</label>
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all duration-200" id="email" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-[0.75rem] font-bold uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-[0.75rem] font-bold text-primary hover:text-on-surface transition-colors duration-200" href="#">Forgot Password?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline focus:ring-1 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full h-12 bg-gradient-to-br from-primary to-primary-dim text-on-primary font-bold rounded-xl shadow-lg shadow-primary/10 hover:opacity-95 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="relative my-10">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/20"></div>
</div>
<div class="relative flex justify-center text-[10px] font-black uppercase tracking-widest">
<span class="bg-white/0 px-4 text-outline">Or continue with</span>
</div>
</div>
<button class="w-full h-12 bg-surface-container-highest/50 hover:bg-surface-container-highest text-on-surface-variant font-bold rounded-xl transition-all duration-200 flex items-center justify-center gap-3 active:scale-[0.98]">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google colorful G logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYDrTVCn0PsZM9ppN74SdEM9hGVT49rO4G40K1YA2F6VbDhDdOrJ0qLQlmfqrP_l20Q7Z3NW4MrHDLXshrfSnguXscmEuDW8ZL3KtPlOY6MKSOMxZpo1wFVxPrbp_9wkHYdQ3EEQo_kANGOTpJo_9owsRwUDGijRTx2Cn5RbNyMwOtFtuzqHtKqLrM-gQey1HpD9OVyHByQbjR6Bdlonw95lSuYTJiU89xOBsrPQcVy-iGvYBtcKnROYKdG8ogaup9tvIBe7g2rj4"/>
                    Sign in with Google
                </button>
<p class="text-center mt-10 text-xs text-on-surface-variant font-medium">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline underline-offset-4" href="#">Create workspace</a>
</p>
</div>
</div>
</main>
<footer class="w-full py-16 border-t border-slate-200/10 dark:border-slate-800/10 bg-slate-50 dark:bg-slate-950">
<div class="max-w-screen-2xl mx-auto flex flex-col md:flex-row justify-between items-center px-8">
<div class="text-xs font-black text-slate-400 dark:text-slate-600 mb-4 md:mb-0">
                LUMINA AI. PRECISION ENGINE V2.4
            </div>
<div class="flex gap-8">
<a class="text-[11px] font-medium uppercase tracking-[0.1em] text-slate-400 hover:text-slate-900 transition-opacity duration-200" href="#">Privacy</a>
<a class="text-[11px] font-medium uppercase tracking-[0.1em] text-slate-400 hover:text-slate-900 transition-opacity duration-200" href="#">Terms</a>
<a class="text-[11px] font-medium uppercase tracking-[0.1em] text-slate-400 hover:text-slate-900 transition-opacity duration-200" href="#">Security</a>
<a class="text-[11px] font-medium uppercase tracking-[0.1em] text-slate-400 hover:text-slate-900 transition-opacity duration-200" href="#">System Status</a>
</div>
</div>
</footer>
