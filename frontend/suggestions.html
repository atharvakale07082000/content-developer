        .material-symbols-outlined {

            background: linear-gradient(135deg, #8083ff 0%, #c0c1ff 100%);

        .glass-panel {
            background: rgba(42, 42, 42, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>

    body {
      min-height: max(884px, 100dvh);

<body class="bg-surface text-on-surface font-body selection:bg-primary selection:text-on-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#131313] dark:bg-[#131313]">
<div class="max-w-[640px] mx-auto flex items-center justify-between px-6 h-16">
<div class="flex items-center gap-4">
<button class="text-[#c0c1ff] scale-95 active:duration-100 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] tracking-tighter font-bold text-[#e5e2e1] text-xl">AI Suggestions</h1>
</div>
<button class="text-[#c7c4d7] hover:text-[#c0c1ff] transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<main class="max-w-[640px] mx-auto pt-24 pb-44 px-6">
<!-- Header Section -->
<div class="mb-10">
<p class="text-on-surface-variant text-sm uppercase tracking-[0.1em] font-medium mb-2">Nocturne AI Analysis</p>
<h2 class="text-4xl font-extrabold tracking-tighter leading-tight text-on-surface">Content strategies refined for your brand.</h2>
</div>
<!-- AI Generated Cards -->
<div id="suggestions-container" class="space-y-6">
    <!-- Dynamic cards will be rendered here -->
</div>
</main>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 right-0 z-[60] pb-8 pt-4 bg-gradient-to-t from-surface via-surface/90 to-transparent">
<div class="max-w-[640px] mx-auto px-6">
<button id="generate-drafts" class="editorial-gradient w-full py-5 rounded-xl text-on-primary font-bold text-lg flex items-center justify-center gap-3 shadow-[0_10px_30px_-5px_rgba(0,0,0,0.5),0_0_15px_-3px_rgba(99,102,241,0.3)] active:scale-95 transition-transform duration-100 disabled:opacity-50">
                Generate Drafts
                <span class="material-symbols-outlined font-bold" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-6 left-0 right-0 z-50 flex justify-around items-center px-4 py-2 bg-[#1c1b1b]/80 backdrop-blur-xl max-w-[400px] mx-auto rounded-full shadow-[0_10px_30px_-5px_rgba(0,0,0,0.5),0_0_15px_-3px_rgba(99,102,241,0.08)]">
<a class="flex items-center justify-center text-[#c7c4d7] p-3 hover:bg-[#2a2a2a] rounded-full transition-all scale-90 active:duration-150" href="#">

<a class="flex items-center justify-center text-[#c7c4d7] p-3 hover:bg-[#2a2a2a] rounded-full transition-all scale-90 active:duration-150" href="#">

</a>
